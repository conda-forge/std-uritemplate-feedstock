schema_version: 1

context:
  name: std-uritemplate
  version: "2.0.13"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/std_uritemplate-${{ version }}.tar.gz
  sha256: acdb8df280986572572a438877a90a243136042a7379152d3b2e05bd6507f989

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - stduritemplate
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: std-uritemplate implementation for Python
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/std-uritemplate/std-uritemplate
  repository: https://github.com/std-uritemplate/std-uritemplate
  documentation: https://github.com/std-uritemplate/std-uritemplate/blob/main/Readme.md

extra:
  recipe-maintainers:
    - xylar
